name: CI

on:
  push:
    branches: [master]
  pull_request:

# Une nouvelle poussée sur une PR annule le run précédent.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, i18n & build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Vérifier la synchro des locales
        run: npm run check:messages

      - name: Build
        run: npm run build
