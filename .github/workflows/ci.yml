name: CI

on:
  push:
    branches: [master]
  pull_request:

# Une nouvelle poussée sur une PR annule le run précédent.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, i18n & build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Vérifier la synchro des locales
        run: npm run check:messages

      # check:links existait dans package.json depuis la PR #9 et n'a jamais tourné
      # nulle part : un garde-fou qu'on n'exécute pas est un garde-fou qu'on n'a pas.
      - name: Vérifier les liens des projets
        run: npm run check:links

      - name: Vérifier le respect du mouvement réduit
        run: npm run check:motion

      - name: Build
        run: npm run build
